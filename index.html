<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestion des Désignations - Club de Basket</title>
    <!-- Tailwind CSS pour un design moderne ultra-rapide -->
    <script src="https://jsdelivr.net"></script>
    <!-- Lucide Icons pour les icônes du tableau de bord -->
    <script src="https://unpkg.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 font-sans min-h-screen">

    <!-- BARRE DE NAVIGATION -->
    <nav class="bg-amber-600 shadow-xl border-b border-amber-700 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <div class="flex items-center gap-3">
                    <div class="bg-white text-amber-600 p-2 rounded-full shadow-inner flex items-center justify-center">
                        <i data-lucide="basketball" class="w-6 h-6 animate-pulse"></i>
                    </div>
                    <span class="font-bold text-xl tracking-tight text-white">BASKET <span class="text-gray-900">CLUB</span></span>
                </div>
                <div class="text-sm bg-amber-700 px-3 py-1.5 rounded-lg border border-amber-500 font-medium hidden sm:block">
                    🏀 Espace Planning & OTM
                </div>
            </div>
        </div>
    </nav>

    <!-- CONTENU PRINCIPAL -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        
        <!-- SECTION EN-TÊTE & STATS -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-8">
            <div class="bg-gray-800 p-6 rounded-2xl border border-gray-700 shadow-md flex items-center justify-between">
                <div>
                    <p class="text-gray-400 text-sm font-medium">Matchs ce Weekend</p>
                    <p class="text-3xl font-bold mt-1 text-amber-500" id="total-matches">3</p>
                </div>
                <div class="bg-amber-500/10 p-3 rounded-xl text-amber-500"><i data-lucide="calendar"></i></div>
            </div>
            <div class="bg-gray-800 p-6 rounded-2xl border border-gray-700 shadow-md flex items-center justify-between">
                <div>
                    <p class="text-gray-400 text-sm font-medium">Postes Non Pourvus</p>
                    <p class="text-3xl font-bold mt-1 text-red-500" id="missing-slots">2</p>
                </div>
                <div class="bg-red-500/10 p-3 rounded-xl text-red-500"><i data-lucide="alert-triangle"></i></div>
            </div>
            <div class="bg-gray-800 p-6 rounded-2xl border border-gray-700 shadow-md flex items-center justify-between">
                <div>
                    <p class="text-gray-400 text-sm font-medium">Bénévoles Mobilisés</p>
                    <p class="text-3xl font-bold mt-1 text-green-500" id="total-volunteers">10</p>
                </div>
                <div class="bg-green-500/10 p-3 rounded-xl text-green-500"><i data-lucide="users"></i></div>
            </div>
        </div>

        <!-- FILTRES DE RECHERCHE -->
        <div class="bg-gray-800 p-4 rounded-xl border border-gray-700 mb-8 flex flex-wrap gap-4 items-center justify-between">
            <div class="flex items-center gap-2">
                <i data-lucide="filter" class="w-4 h-4 text-gray-400"></i>
                <span class="text-sm font-medium text-gray-400">Filtrer par équipe :</span>
            </div>
            <div class="flex flex-wrap gap-2" id="filter-buttons">
                <button onclick="filterTeam('Tous')" class="px-4 py-1.5 rounded-lg text-sm font-medium bg-amber-600 text-white transition-all cursor-pointer shadow-md">Tous</button>
                <button onclick="filterTeam('Seniors M')" class="px-4 py-1.5 rounded-lg text-sm font-medium bg-gray-700 text-gray-300 hover:bg-gray-600 transition-all cursor-pointer">Seniors M</button>
                <button onclick="filterTeam('U18 F')" class="px-4 py-1.5 rounded-lg text-sm font-medium bg-gray-700 text-gray-300 hover:bg-gray-600 transition-all cursor-pointer">U18 F</button>
                <button onclick="filterTeam('U15 M')" class="px-4 py-1.5 rounded-lg text-sm font-medium bg-gray-700 text-gray-300 hover:bg-gray-600 transition-all cursor-pointer">U15 M</button>
            </div>
        </div>

        <!-- LISTE DES MATCHS ET DÉSIGNATIONS -->
        <div class="space-y-6" id="matches-container">
            <!-- Injecté dynamiquement par le script -->
        </div>

    </main>

    <!-- FORMULAIRE MODAL POUR VOLONTAIRE -->
    <div id="volunteer-modal" class="fixed inset-0 bg-black/70 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-gray-800 border border-gray-700 rounded-2xl w-full max-w-md p-6 shadow-2xl relative animate-in fade-in zoom-in-95 duration-200">
            <h3 class="text-xl font-bold text-white mb-2 flex items-center gap-2">
                <i data-lucide="user-plus" class="text-amber-500"></i> Se positionner sur ce rôle
            </h3>
            <p class="text-gray-400 text-sm mb-4" id="modal-description"></p>
            
            <form id="volunteer-form" onsubmit="submitVolunteer(event)">
                <input type="hidden" id="match-id">
                <input type="hidden" id="role-key">
                
                <div class="mb-4">
                    <label class="block text-gray-300 text-sm font-medium mb-2" for="volunteer-name">Votre Nom & Prénom</label>
                    <input type="text" id="volunteer-name" required class="w-full bg-gray-900 border border-gray-600 rounded-xl px-4 py-2.5 text-white focus:outline-none focus:border-amber-500 transition-all placeholder-gray-500" placeholder="Ex: Jean Dupont">
                </div>
                
                <div class="flex justify-end gap-3 mt-6">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 text-sm font-medium text-gray-400 hover:text-white transition-all cursor-pointer">Annuler</button>
                    <button type="submit" class="bg-amber-600 hover:bg-amber-500 text-white font-medium text-sm px-5 py-2 rounded-xl shadow-lg transition-all cursor-pointer">Confirmer ma présence</button>
                </div>
            </form>
        </div>
    </div>

    <!-- SCRIPT DE LOGIQUE APPLICATIVE -->
    <script>
        // Simulation des données du club (Stockées en mémoire)
        let matchesData = [
            {
                id: 1,
                team: "Seniors M",
                opponent: "Basket Club Villefranche",
                date: "Samedi 31 Octobre",
                time: "20:30",
                location: "Gymnase Municipal (Domicile)",
                designations: {
                    arbitre1: "Marc L. (Officiel)",
                    arbitre2: "",
                    marqueur: "Sophie T.",
                    chronometreur: "",
                    responsable: "Pierre A."
                }
            },
            {
                id: 2,
                team: "U18 F",
                opponent: "AS Villeurbanne",
                date: "Dimanche 01 Novembre",
                time: "13:30",
                location: "Gymnase Municipal (Domicile)",
                designations: {
                    arbitre1: "Thomas P.",
                    arbitre2: "Lucas M.",
                    marqueur: "Julie V.",
                    chronometreur: "Nathan B.",
                    responsable: "Antoine D."
                }
            },
            {
                id: 3,
                team: "U15 M",
                opponent: "AL Meyzieu",
                date: "Samedi 31 Octobre",
                time: "14:00",
                location: "Gymnase Municipal (Domicile)",
                designations: {
                    arbitre1: "",
                    arbitre2: "",
                    marqueur: "",
                    chronometreur: "",
                    responsable: ""
                }
            }
        ];

        const roleLabels = {
            arbitre1: "Arbitre Principal",
            arbitre2: "Arbitre Secondaire",
            marqueur: "Marqueur (Table)",
            chronometreur: "Chronométreur (Table)",
            responsable: "Responsable de Salle"
        };

        let currentFilter = "Tous";

        function renderMatches() {
            const container = document.getElementById('matches-container');
            container.innerHTML = '';
            
            let missingCount = 0;
            let volunteerCount = 0;
            let matchCount = 0;

            matchesData.forEach(match => {
                // Compter les statistiques globales
                Object.values(match.designations).forEach(val => {
                    if(val === "") missingCount++;
                    else volunteerCount++;
                });

                if (currentFilter !== "Tous" && match.team !== currentFilter) return;
                matchCount++;

                // Création du bloc de match
                const matchCard = document.createElement('div');
                matchCard.className = "bg-gray-800 border border-gray-700 rounded-2xl shadow-xl overflow-hidden transition-all duration-300 hover:border-gray-600";
                
                let designationsHtml = '';
                
                Object.keys(roleLabels).forEach(roleKey => {
                    const assigned = match.designations[roleKey];
                    const isVacant = assigned === "";
                    
                    designationsHtml += `
                        <div class="flex items-center justify-between p-3 rounded-xl ${isVacant ? 'bg-red-500/5 border border-red-500/20' : 'bg-gray-900/50 border border-gray-700/50'}">
                            <div class="flex items-center gap-3">
